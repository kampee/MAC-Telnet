
name: Build MAC-Telnet ARM64 Static

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    container:
      image: alpine:3.21

    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            git \
            build-base \
            linux-headers \
            autoconf \
            automake \
            libtool \
            gettext \
            gettext-dev \
            openssl-dev \
            openssl-libs-static \
            libbsd-dev \
            libmd-dev \
            libmd-static \
            pkgconf \
            file \
            binutils

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check static libraries
        run: |
          echo "Checking ARM64 static libraries"
          find /usr/lib -name 'libbsd.a' -o -name 'libmd.a' -o -name 'libcrypto.a'
    
      - name: Configure and build
        run: |
          ./autogen.sh

          ./configure \
            --without-mactelnetd \
            LDFLAGS="-static"

          make -j2

      - name: Verify static binary
        run: |
          file src/mactelnet
          readelf -h src/mactelnet

          if readelf -l src/mactelnet | grep -q INTERP; then
            echo "ERROR: Binary is dynamically linked"
            exit 1
          fi

          ./src/mactelnet --help

      - name: Package binary
        run: |
          mkdir -p output
          cp src/mactelnet output/
          tar -czf mactelnet-arm64-static.tar.gz \
            -C output mactelnet

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mactelnet-arm64-static
          path: mactelnet-arm64-static.tar.gz
